<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Перекличка</title>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --paper:#f4f6f8;
    --card:#ffffff;
    --line:#e1e5ea;
    --ok:#1f7a4d;
    --ok-bg:#e7f5ec;
    --alarm:#b8221f;
    --alarm-bg:#fdeceb;
    --accent:#2c5aa0;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior:none;
  }
  .screen{ display:none; min-height:100vh; flex-direction:column; }
  .screen.active{ display:flex; }

  header.bar{
    padding:14px 16px 12px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  header.bar h1{ font-size:18px; margin:0; font-weight:650; letter-spacing:-0.2px; }
  header.bar .sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .back{
    width:34px; height:34px; border-radius:10px; border:none;
    background:var(--paper); color:var(--accent); font-size:19px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .grow{flex:1; min-width:0;}
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:none;
    background:var(--paper); color:var(--ink-soft); font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-row{ display:flex; gap:6px; flex-shrink:0; }

  .session-bar{
    display:flex; gap:8px; padding:10px 16px; background:var(--card);
    border-bottom:1px solid var(--line); align-items:center;
  }
  .session-field{ flex:1; min-width:0; }
  .session-field label{ font-size:11px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .session-field input{
    width:100%; min-width:0; padding:9px 8px; border-radius:9px; border:1px solid var(--line);
    font-size:14px; background:var(--paper); color:var(--ink); box-sizing:border-box;
  }
  .session-field.lesson{ flex:0 0 88px; }
  .session-field.lesson input{ text-align:center; }

  main{ flex:1; overflow-y:auto; padding:14px 16px 100px; -webkit-overflow-scrolling:touch; }
  main.no-footer{ padding-bottom:24px; }

  /* --- список класів --- */
  .class-row{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
  }
  .class-row .name{ font-size:16px; font-weight:600; }
  .class-row .meta{ font-size:13px; color:var(--ink-soft); margin-top:3px; }
  .class-row .chev{ color:#b7bec8; font-size:18px; }

  .add-btn{
    width:100%; padding:15px; border-radius:var(--radius); border:1.5px dashed #b7c2cf;
    background:transparent; color:var(--accent); font-size:15px; font-weight:600; margin-top:6px;
  }

  /* --- рядки дітей --- */
  .stu-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;
  }
  .stu-row .nm{ flex:1; font-size:16px; font-weight:500; }
  .check{
    width:28px; height:28px; border-radius:8px; border:2px solid #c7cdd5;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-size:16px; color:transparent; font-weight:700;
  }
  .stu-row.present .check{ background:var(--ok); border-color:var(--ok); color:white; }
  .stu-row.present{ background:var(--ok-bg); border-color:#c7e6d3; }

  .stu-row.shelter-mode .check{ border-color:var(--alarm); }
  .stu-row.shelter-mode.verified{ background:var(--alarm-bg); border-color:#f3bcb9; }
  .stu-row.shelter-mode.verified .check{ background:var(--alarm); border-color:var(--alarm); color:white; }

  .stu-row .del{ color:#c7cdd5; font-size:20px; padding:4px 6px; flex-shrink:0; }
  .row-actions{ display:flex; align-items:center; gap:10px; }
  .row-del{ color:#c7cdd5; font-size:19px; padding:6px; flex-shrink:0; }

  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 20px; line-height:1.5; }

  /* --- нижня панель --- */
  footer.summary{
    position:fixed; left:0; right:0; bottom:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .count-pill{ font-size:13px; color:var(--ink-soft); flex:1; }
  .count-pill b{ color:var(--ink); }
  .alarm-toggle{
    background:var(--alarm); color:white; border:none; border-radius:12px;
    padding:13px 18px; font-size:15px; font-weight:700; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .add-lesson-btn{
    background:var(--accent); color:white; border:none; border-radius:12px;
    padding:14px 18px; font-size:15px; font-weight:700; width:100%;
  }

  /* --- екран тривоги --- */
  .alarm-banner{ background:var(--alarm); color:white; padding:14px 18px; text-align:center; }
  .alarm-banner .t1{ font-size:15px; font-weight:700; letter-spacing:0.3px; }
  .alarm-banner .t2{ font-size:13px; opacity:0.9; margin-top:3px; }
  .screen.alarm-active main{ background:#fff8f7; padding-bottom:230px; }
  .all-clear{
    background:var(--ok); color:white; border:none; border-radius:12px;
    padding:13px 18px; font-size:15px; font-weight:700; width:100%;
  }
  .stand-down{
    background:transparent; color:var(--ink-soft); border:none;
    font-size:14px; text-align:center; width:100%; padding:10px; margin-top:2px;
  }

  /* --- форми --- */
  textarea.field{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    font-size:15px; background:var(--card); margin-bottom:10px; resize:vertical;
    font-family:inherit; line-height:1.5; min-height:110px;
  }
  textarea.field:focus, .field:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .primary-btn{
    width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:white; font-size:15px; font-weight:700;
  }
  .hint{ font-size:12px; color:var(--ink-soft); margin:-4px 0 14px; line-height:1.5; }

  /* --- уроки в хабі класу --- */
  .hist-row{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;
  }
  .hist-row .d{ font-size:15px; font-weight:600; text-transform:capitalize; }
  .hist-row .l{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .hist-row .c{ font-size:13px; color:var(--ok); font-weight:600; }

  /* --- форма нового уроку --- */
  .form-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .form-field{ margin-bottom:16px; }
  .form-field label{ font-size:13px; color:var(--ink-soft); display:block; margin-bottom:6px; font-weight:600; }
  .form-field input{
    width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--line);
    font-size:16px; background:var(--paper); color:var(--ink);
    box-sizing:border-box; min-width:0; display:block;
  }
  input[type="date"]{
    -webkit-appearance:none; appearance:none;
    width:100%; min-width:0; box-sizing:border-box;
  }

  /* --- модалка підтвердження --- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,24,30,0.5);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.active{ display:flex; }
  .modal-card{
    background:var(--card); width:100%; max-width:480px;
    border-radius:18px 18px 0 0; padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .modal-card .m-title{ font-size:16px; font-weight:700; margin-bottom:6px; }
  .modal-card .m-text{ font-size:14px; color:var(--ink-soft); line-height:1.5; margin-bottom:20px; }
  .modal-btn{
    width:100%; padding:14px; border-radius:12px; border:none;
    font-size:15px; font-weight:700; margin-bottom:10px;
  }
  .modal-btn.cancel{ background:var(--paper); color:var(--ink); }
  .modal-btn.danger{ background:var(--alarm); color:white; margin-bottom:0; }
</style>
</head>
<body>

<!-- ===== ЕКРАН 1: список класів ===== -->
<div class="screen active" id="screen-home">
  <header class="bar">
    <div class="grow">
      <h1>Перекличка</h1>
      <div class="sub" id="today-label"></div>
    </div>
  </header>
  <main class="no-footer">
    <div id="class-list"></div>
    <button class="add-btn" onclick="addClass()">+ Додати клас / групу</button>
  </main>
</div>

<!-- ===== ЕКРАН 2: хаб класу — список уроків ===== -->
<div class="screen" id="screen-class">
  <header class="bar">
    <button class="back" onclick="goHome()">‹</button>
    <div class="grow">
      <h1 id="class-hub-title">Клас</h1>
    </div>
    <div class="icon-row">
      <button class="icon-btn" onclick="editRoster()" title="Список дітей">☰</button>
    </div>
  </header>
  <main class="no-footer">
    <button class="add-lesson-btn" onclick="openAddLesson()" style="margin-bottom:16px;">+ Додати урок</button>
    <div id="class-hub-list"></div>
  </main>
</div>

<!-- ===== ЕКРАН 3: новий урок — вибір дати і номера ===== -->
<div class="screen" id="screen-add-lesson">
  <header class="bar">
    <button class="back" onclick="closeAddLesson()">‹</button>
    <div class="grow">
      <h1>Новий урок</h1>
    </div>
  </header>
  <main class="no-footer">
    <div class="form-card">
      <div class="form-field">
        <label>Дата</label>
        <input type="date" id="new-lesson-date">
      </div>
      <div class="form-field">
        <label>Номер уроку</label>
        <input type="number" id="new-lesson-number" min="1" max="12" step="1">
      </div>
    </div>
    <div style="height:16px;"></div>
    <button class="primary-btn" onclick="confirmAddLesson()">Почати урок</button>
  </main>
</div>

<!-- ===== ЕКРАН 4: урок (відвідуваність) ===== -->
<div class="screen" id="screen-lesson">
  <header class="bar">
    <button class="back" onclick="backFromLesson()">‹</button>
    <div class="grow">
      <h1 id="lesson-title">Клас</h1>
    </div>
  </header>
  <div class="session-bar">
    <div class="session-field">
      <label>Дата</label>
      <input type="date" id="session-date" onchange="onSessionChange()">
    </div>
    <div class="session-field lesson">
      <label>Номер уроку</label>
      <input type="number" id="session-lesson" min="1" max="12" step="1" onchange="onSessionChange()">
    </div>
  </div>
  <main>
    <div id="lesson-list"></div>
  </main>
  <footer class="summary">
    <div class="count-pill">Присутні: <b id="present-count">0</b> з <span id="total-count">0</span></div>
    <button class="alarm-toggle" onclick="triggerAlarm()">🚨 Тривога</button>
  </footer>
</div>

<!-- ===== ЕКРАН 5: тривога — перевірка укриття ===== -->
<div class="screen alarm-active" id="screen-alarm">
  <div class="alarm-banner">
    <div class="t1">ТРИВОГА — ПЕРЕВІРКА УКРИТТЯ</div>
    <div class="t2" id="alarm-sub">Відмічайте кожну дитину, коли побачите її в укритті</div>
  </div>
  <main>
    <div id="alarm-list"></div>
  </main>
  <footer class="summary" style="flex-direction:column; align-items:stretch;">
    <div class="count-pill" style="text-align:center; margin-bottom:8px;">
      В укритті: <b id="shelter-count">0</b> з <span id="shelter-total">0</span>
    </div>
    <button class="all-clear" id="all-clear-btn" onclick="standDown()" disabled>Усіх знайдено — відбій</button>
    <button class="stand-down" onclick="standDown(true)">Зняти тривогу вручну</button>
  </footer>
</div>

<!-- ===== ЕКРАН 6: список дітей ===== -->
<div class="screen" id="screen-roster">
  <header class="bar">
    <button class="back" onclick="backFromRoster()">‹</button>
    <div class="grow">
      <h1 id="roster-title">Список дітей</h1>
    </div>
  </header>
  <main class="no-footer">
    <textarea class="field" id="bulk-student-names" placeholder="Прізвище ім'я&#10;Прізвище ім'я"></textarea>
    <div class="hint">Кожна дитина — з нового рядка. Можна вставити одразу весь список класу.</div>
    <button class="primary-btn" onclick="addStudentsBulk()">Додати дітей</button>
    <div style="height:18px;"></div>
    <div id="roster-list"></div>
  </main>
</div>

<!-- ===== МОДАЛКА ПІДТВЕРДЖЕННЯ ===== -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <div class="m-title" id="confirm-title">Видалити?</div>
    <div class="m-text" id="confirm-text"></div>
    <button class="modal-btn cancel" onclick="closeConfirm()">Скасувати</button>
    <button class="modal-btn danger" id="confirm-danger-btn">Видалити</button>
  </div>
</div>

<script>
/* ---------- сховище ---------- */
const LS_CLASSES = 'att_classes_v2';
let classes = JSON.parse(localStorage.getItem(LS_CLASSES) || '[]');
let currentClassId = null;
let currentDate = null;
let currentLesson = null;

function saveClasses(){ localStorage.setItem(LS_CLASSES, JSON.stringify(classes)); }
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayLabel(){
  return new Date().toLocaleDateString('uk-UA', {day:'numeric', month:'long', weekday:'long'});
}
function formatDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('uk-UA', {day:'numeric', month:'long', weekday:'short'});
}

function sessKey(classId, date, lesson){ return classId+'_'+date+'_'+lesson; }
function attKey(classId, date, lesson){ return 'att_'+sessKey(classId,date,lesson); }
function shelterKey(classId, date, lesson){ return 'shelter_'+sessKey(classId,date,lesson); }
function alarmFlagKey(classId, date, lesson){ return 'alarmflag_'+sessKey(classId,date,lesson); }
function sessionsRegKey(classId){ return 'sessions_'+classId; }

function getAttendance(classId,date,lesson){
  return JSON.parse(localStorage.getItem(attKey(classId,date,lesson)) || '{}');
}
function saveAttendance(classId,date,lesson,data){
  localStorage.setItem(attKey(classId,date,lesson), JSON.stringify(data));
  registerSession(classId,date,lesson);
}
function getShelter(classId,date,lesson){
  return JSON.parse(localStorage.getItem(shelterKey(classId,date,lesson)) || '{}');
}
function saveShelter(classId,date,lesson,data){
  localStorage.setItem(shelterKey(classId,date,lesson), JSON.stringify(data));
}

function getSessions(classId){
  return JSON.parse(localStorage.getItem(sessionsRegKey(classId)) || '[]');
}
function registerSession(classId,date,lesson){
  const list = getSessions(classId);
  const exists = list.some(s=>s.date===date && s.lesson===lesson);
  if(!exists){
    list.push({date, lesson});
    list.sort((a,b)=> a.date===b.date ? b.lesson-a.lesson : (a.date < b.date ? 1 : -1));
    localStorage.setItem(sessionsRegKey(classId), JSON.stringify(list));
  }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- сортування та унікальність ---------- */
function parseClassName(name){
  const m = name.trim().match(/^(\d+)\s*-?\s*([A-Za-zА-Яа-яҐґЄєІіЇїʼ']?)/);
  if(m){
    return { num: parseInt(m[1],10), letter: (m[2]||'').toLowerCase() };
  }
  return null;
}
function compareClasses(a,b){
  const pa = parseClassName(a.name);
  const pb = parseClassName(b.name);
  if(pa && pb){
    if(pa.num !== pb.num) return pa.num - pb.num;
    return pa.letter.localeCompare(pb.letter, 'uk');
  }
  if(pa && !pb) return -1;
  if(!pa && pb) return 1;
  return a.name.localeCompare(b.name, 'uk');
}
function sortedClasses(){
  return [...classes].sort(compareClasses);
}
function sortedStudents(cls){
  return [...cls.students].sort((a,b)=>a.name.localeCompare(b.name, 'uk'));
}
function normName(s){ return s.trim().toLowerCase(); }

/* ---------- модалка підтвердження ---------- */
function askConfirm(title, text, onConfirm){
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-text').textContent = text;
  const btn = document.getElementById('confirm-danger-btn');
  const freshBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(freshBtn, btn);
  freshBtn.addEventListener('click', ()=>{
    closeConfirm();
    onConfirm();
  });
  document.getElementById('confirm-modal').classList.add('active');
}
function closeConfirm(){
  document.getElementById('confirm-modal').classList.remove('active');
}

/* ---------- навігація ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){
  currentClassId = null;
  renderHome();
  show('screen-home');
}

/* ---------- екран: список класів ---------- */
function renderHome(){
  document.getElementById('today-label').textContent = todayLabel();
  const list = document.getElementById('class-list');
  list.innerHTML = '';
  if(classes.length === 0){
    list.innerHTML = '<div class="empty">Поки немає жодного класу.<br>Додайте перший, щоб почати.</div>';
    return;
  }
  sortedClasses().forEach(c=>{
    const sessionsCount = getSessions(c.id).length;
    const row = document.createElement('div');
    row.className = 'class-row';
    row.onclick = ()=>openClass(c.id);
    row.innerHTML = `
      <div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="meta">${c.students.length} дітей · ${sessionsCount} уроків</div>
      </div>
      <div class="row-actions">
        <div class="row-del" onclick="event.stopPropagation(); deleteClass('${c.id}')">✕</div>
        <div class="chev">›</div>
      </div>`;
    list.appendChild(row);
  });
}

function addClass(){
  const name = prompt('Назва класу або групи (наприклад, 5-А):');
  if(!name || !name.trim()) return;
  const trimmed = name.trim();
  const dup = classes.some(c=>normName(c.name) === normName(trimmed));
  if(dup){ alert(`Клас «${trimmed}» вже існує.`); return; }
  classes.push({ id: uid(), name: trimmed, students: [] });
  saveClasses();
  renderHome();
}

function deleteClass(id){
  const cls = getClass(id);
  if(!cls) return;
  askConfirm(
    'Видалити клас?',
    `«${cls.name}» і всі його уроки та відмітки буде видалено назавжди. Це не можна скасувати.`,
    ()=>{
      const sessions = getSessions(id);
      sessions.forEach(s=>{
        localStorage.removeItem(attKey(id, s.date, s.lesson));
        localStorage.removeItem(shelterKey(id, s.date, s.lesson));
        localStorage.removeItem(alarmFlagKey(id, s.date, s.lesson));
      });
      localStorage.removeItem(sessionsRegKey(id));
      classes = classes.filter(c=>c.id!==id);
      saveClasses();
      renderHome();
    }
  );
}

function getClass(id){ return classes.find(c=>c.id===id); }

/* ---------- екран: хаб класу (список уроків) ---------- */
function openClass(id){
  currentClassId = id;
  renderClassHub();
  show('screen-class');
}
function renderClassHub(){
  const cls = getClass(currentClassId);
  document.getElementById('class-hub-title').textContent = cls.name;
  const sessions = getSessions(cls.id);
  const wrap = document.getElementById('class-hub-list');
  wrap.innerHTML = '';
  if(sessions.length === 0){
    wrap.innerHTML = '<div class="empty">Тут поки немає жодного уроку.<br>Натисніть «+ Додати урок», щоб почати перекличку.</div>';
    return;
  }
  sessions.forEach(s=>{
    const att = getAttendance(cls.id, s.date, s.lesson);
    const presentCount = cls.students.filter(st=>att[st.id]).length;
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.onclick = ()=>{
      currentDate = s.date;
      currentLesson = s.lesson;
      enterLesson();
    };
    row.innerHTML = `
      <div>
        <div class="d">${formatDate(s.date)}</div>
        <div class="l">Урок ${s.lesson}</div>
      </div>
      <div class="row-actions">
        <div class="c">${presentCount} з ${cls.students.length}</div>
        <div class="row-del" onclick="event.stopPropagation(); deleteLesson('${s.date}', ${s.lesson})">✕</div>
      </div>`;
    wrap.appendChild(row);
  });
}

function deleteLesson(date, lesson){
  const cls = getClass(currentClassId);
  askConfirm(
    'Видалити урок?',
    `Урок ${lesson} за ${formatDate(date)} і всі його відмітки буде видалено назавжди.`,
    ()=>{
      localStorage.removeItem(attKey(cls.id, date, lesson));
      localStorage.removeItem(shelterKey(cls.id, date, lesson));
      localStorage.removeItem(alarmFlagKey(cls.id, date, lesson));
      const remaining = getSessions(cls.id).filter(s=>!(s.date===date && s.lesson===lesson));
      localStorage.setItem(sessionsRegKey(cls.id), JSON.stringify(remaining));
      renderClassHub();
    }
  );
}

/* ---------- екран: новий урок ---------- */
function openAddLesson(){
  const cls = getClass(currentClassId);
  const today = todayKey();
  document.getElementById('new-lesson-date').value = today;
  const sessionsToday = getSessions(cls.id).filter(s=>s.date===today);
  const suggestedLesson = sessionsToday.length
    ? Math.max(...sessionsToday.map(s=>s.lesson)) + 1
    : 1;
  document.getElementById('new-lesson-number').value = suggestedLesson;
  show('screen-add-lesson');
}
function closeAddLesson(){
  show('screen-class');
}
function confirmAddLesson(){
  const dateVal = document.getElementById('new-lesson-date').value;
  let lessonVal = parseInt(document.getElementById('new-lesson-number').value, 10);
  if(!dateVal){ alert('Вкажіть дату уроку.'); return; }
  if(!lessonVal || lessonVal < 1) lessonVal = 1;
  const already = getSessions(currentClassId).some(s=>s.date===dateVal && s.lesson===lessonVal);
  currentDate = dateVal;
  currentLesson = lessonVal;
  registerSession(currentClassId, currentDate, currentLesson);
  if(already){
    alert(`Урок ${lessonVal} за ${formatDate(dateVal)} вже існує — відкриваю наявні відмітки.`);
  }
  enterLesson();
}

/* ---------- екран: урок (відвідуваність) ---------- */
function onSessionChange(){
  const dateVal = document.getElementById('session-date').value;
  let lessonVal = parseInt(document.getElementById('session-lesson').value, 10);
  if(!dateVal) return;
  if(!lessonVal || lessonVal < 1) lessonVal = 1;
  currentDate = dateVal;
  currentLesson = lessonVal;
  registerSession(currentClassId, currentDate, currentLesson);
  document.getElementById('session-lesson').value = currentLesson;
  enterLesson();
}

function enterLesson(){
  if(localStorage.getItem(alarmFlagKey(currentClassId, currentDate, currentLesson)) === '1'){
    renderAlarm();
    show('screen-alarm');
    return;
  }
  renderLesson();
  show('screen-lesson');
}

function backFromLesson(){
  renderClassHub();
  show('screen-class');
}

function renderLesson(){
  const cls = getClass(currentClassId);
  document.getElementById('lesson-title').textContent = cls.name;
  document.getElementById('session-date').value = currentDate;
  document.getElementById('session-lesson').value = currentLesson;
  const att = getAttendance(cls.id, currentDate, currentLesson);
  const wrap = document.getElementById('lesson-list');
  wrap.innerHTML = '';
  if(cls.students.length === 0){
    wrap.innerHTML = '<div class="empty">У цьому класі поки немає дітей.<br>Поверніться назад і натисніть ☰, щоб додати список.</div>';
  }
  sortedStudents(cls).forEach(s=>{
    const present = !!att[s.id];
    const row = document.createElement('div');
    row.className = 'stu-row' + (present ? ' present':'');
    row.onclick = ()=>{
      const a = getAttendance(cls.id, currentDate, currentLesson);
      a[s.id] = !a[s.id];
      saveAttendance(cls.id, currentDate, currentLesson, a);
      renderLesson();
    };
    row.innerHTML = `<div class="check">✓</div><div class="nm">${escapeHtml(s.name)}</div>`;
    wrap.appendChild(row);
  });
  const presentCount = cls.students.filter(st=>att[st.id]).length;
  document.getElementById('present-count').textContent = presentCount;
  document.getElementById('total-count').textContent = cls.students.length;
}

/* ---------- тривога ---------- */
function triggerAlarm(){
  const cls = getClass(currentClassId);
  const att = getAttendance(cls.id, currentDate, currentLesson);
  const presentIds = Object.keys(att).filter(id=>att[id]);
  if(presentIds.length === 0){
    if(!confirm('Жодна дитина не відмічена присутньою на цьому уроці. Все одно почати перевірку укриття?')) return;
  }
  saveShelter(cls.id, currentDate, currentLesson, {});
  localStorage.setItem(alarmFlagKey(cls.id, currentDate, currentLesson), '1');
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,200]);
  renderAlarm();
  show('screen-alarm');
}

function renderAlarm(){
  const cls = getClass(currentClassId);
  const att = getAttendance(cls.id, currentDate, currentLesson);
  const shelter = getShelter(cls.id, currentDate, currentLesson);
  const presentStudents = sortedStudents(cls).filter(s=>att[s.id]);
  const wrap = document.getElementById('alarm-list');
  wrap.innerHTML = '';
  if(presentStudents.length === 0){
    wrap.innerHTML = '<div class="empty">Немає дітей, відмічених присутніми на цьому уроці.</div>';
  }
  presentStudents.forEach(s=>{
    const verified = !!shelter[s.id];
    const row = document.createElement('div');
    row.className = 'stu-row shelter-mode' + (verified ? ' verified':'');
    row.onclick = ()=>{
      const sh = getShelter(cls.id, currentDate, currentLesson);
      sh[s.id] = !sh[s.id];
      saveShelter(cls.id, currentDate, currentLesson, sh);
      renderAlarm();
    };
    row.innerHTML = `<div class="check">✓</div><div class="nm">${escapeHtml(s.name)}</div>`;
    wrap.appendChild(row);
  });
  const verifiedCount = Object.values(shelter).filter(Boolean).length;
  document.getElementById('shelter-count').textContent = verifiedCount;
  document.getElementById('shelter-total').textContent = presentStudents.length;
  const btn = document.getElementById('all-clear-btn');
  const allFound = presentStudents.length > 0 && verifiedCount === presentStudents.length;
  btn.disabled = !allFound;
  document.getElementById('alarm-sub').textContent = allFound
    ? 'Усіх дітей знайдено. Можна зняти тривогу.'
    : 'Відмічайте кожну дитину, коли побачите її в укритті';
}

function standDown(manual){
  const cls = getClass(currentClassId);
  if(manual){
    if(!confirm('Зняти тривогу вручну, хоча не всі діти відмічені знайденими?')) return;
  }
  localStorage.removeItem(alarmFlagKey(cls.id, currentDate, currentLesson));
  renderLesson();
  show('screen-lesson');
}

/* ---------- список дітей ---------- */
function editRoster(){
  const cls = getClass(currentClassId);
  document.getElementById('roster-title').textContent = 'Список: ' + cls.name;
  document.getElementById('bulk-student-names').value = '';
  renderRoster();
  show('screen-roster');
}
function backFromRoster(){
  renderClassHub();
  show('screen-class');
}
function renderRoster(){
  const cls = getClass(currentClassId);
  const wrap = document.getElementById('roster-list');
  wrap.innerHTML = '';
  if(cls.students.length === 0){
    wrap.innerHTML = '<div class="empty">Додайте дітей у полі вище.</div>';
  }
  sortedStudents(cls).forEach(s=>{
    const row = document.createElement('div');
    row.className = 'stu-row';
    row.innerHTML = `<div class="nm">${escapeHtml(s.name)}</div><div class="del" onclick="event.stopPropagation(); removeStudent('${s.id}')">✕</div>`;
    wrap.appendChild(row);
  });
}
function addStudentsBulk(){
  const textarea = document.getElementById('bulk-student-names');
  const lines = textarea.value.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length === 0) return;
  const cls = getClass(currentClassId);
  const existing = new Set(cls.students.map(s=>normName(s.name)));
  const addedThisBatch = new Set();
  const skipped = [];
  lines.forEach(name=>{
    const key = normName(name);
    if(existing.has(key) || addedThisBatch.has(key)){
      skipped.push(name);
      return;
    }
    cls.students.push({ id: uid(), name });
    addedThisBatch.add(key);
  });
  saveClasses();
  textarea.value = '';
  renderRoster();
  if(skipped.length){
    alert('Уже є в списку, пропущено:\n' + skipped.join('\n'));
  }
}
function removeStudent(sid){
  const cls = getClass(currentClassId);
  const stu = cls.students.find(s=>s.id===sid);
  askConfirm(
    'Видалити дитину?',
    `«${stu ? stu.name : ''}» буде видалено зі списку класу разом з її відмітками в усіх уроках.`,
    ()=>{
      cls.students = cls.students.filter(s=>s.id!==sid);
      saveClasses();
      // прибираємо відмітки цієї дитини з усіх уроків класу, щоб лічильники не з'їжджали
      const sessions = getSessions(cls.id);
      sessions.forEach(sess=>{
        const att = getAttendance(cls.id, sess.date, sess.lesson);
        if(sid in att){
          delete att[sid];
          localStorage.setItem(attKey(cls.id, sess.date, sess.lesson), JSON.stringify(att));
        }
        const shelter = getShelter(cls.id, sess.date, sess.lesson);
        if(sid in shelter){
          delete shelter[sid];
          localStorage.setItem(shelterKey(cls.id, sess.date, sess.lesson), JSON.stringify(shelter));
        }
      });
      renderRoster();
    }
  );
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- старт ---------- */
renderHome();
</script>
